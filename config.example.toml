# Copy to ~/.config/sharei/config.toml (or point --config / $SHAREI_CONFIG at it).
# Every key is optional; command-line flags win over this file.

# Only this machine can reach sharei by default. "0.0.0.0" opens it to your network,
# where anyone can use it without a password; prefer a reverse proxy with a login.
# host = "127.0.0.1"
# port = 8000

# Screenshots go in <root>/<project>/shots, dropped files in <root>/<project>/drop.
# The systemd unit can only write under ~/tmp; widen ReadWritePaths if you move it.
# root = "~/tmp/sharei"

# Project for uploads without ?project= and for files from the Android Share menu.
# default_project = "inbox"

# Seconds before the clipboard clears, 0 keeps it. Without this the saved setting is kept.
# clip_ttl = 600

# Colour theme for browsers that haven't picked one with the theme button: auto
# (follows the device's light or dark setting), light, dark, dracula, tokyo-night, rose-pine
# or rose-pine-dawn.
# theme = "auto"

# Address your phone uses to reach sharei, for the QR codes of sharei pages opened on
# localhost. Without it, sharei uses this machine's network address when host listens
# beyond localhost, and the address in the browser otherwise.
# public_url = "https://share.example.com"

# Show the QR buttons that open a page or file on another device. Set to false to
# hide them everywhere.
# qr = true

# Contact sent to the browser's push service with phone notifications (needs the push
# extra). A mailto: or https: address; defaults to public_url when it is https. Apple
# rejects placeholder addresses, so set a real one if you use an iPhone.
# push_subject = "mailto:you@example.com"

# Extra Host headers and browser Origins accepted (added to the built-in local ones).
# allow_hosts = ["share.example.com"]
# allow_origins = ["https://share.example.com"]

# Build artifacts listed on the Artifacts page. Each entry is a repo (root) and the
# files to offer from it (patterns, relative to the repo; ** matches any number of
# folders). Git worktrees of a repo are scanned too. Hidden folders, node_modules and
# symlinks pointing outside the repo are ignored.
#
# A single repo. name defaults to the folder name, and project (also the Drop
# project) to the lowercased folder name.
# [[artifacts]]
# name = "Liseur"
# project = "liseur"
# root = "~/src/liseur"
# patterns = ["app/build/outputs/apk/**/*.apk"]
#
# Every git repo matching a glob. name and project cannot be set here; each repo
# uses its folder name. An entry for a single repo above wins over this one.
# [[artifacts]]
# root = "~/src/*"
# patterns = ["**/build/outputs/apk/**/*.apk", "dist/*.whl", "target/release/*.tar.gz"]
